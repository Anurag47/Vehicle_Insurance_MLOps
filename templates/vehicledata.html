<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <!-- Corrected the CSS path -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Vehicle Insurance Prediction</h1>

        <form method="post" action="/">
            <label for="Gender">Gender:</label>
                <select id="Gender" name="Gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                </select>

            <label for="Age">Age (18-80):</label>
            <input type="number" id="Age" name="Age" min="18" max="80" required>

            <label for="Driving_License">Driving License:</label>
                <select id="Driving_License" name="Driving_License" required>
                <option value="">Select Option</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
                </select>

            <label for="Region_Code">Region Code (0-52):</label>
            <input type="number" id="Region_Code" name="Region_Code" min="0" max="52" required>

            <label for="Previously_Insured">Previously Insured:</label>
                <select id="Previously_Insured" name="Previously_Insured" required>
                <option value="">Select Option</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
                </select>

            <label for="Annual_Premium">Annual Premium (5,000 - 100,000):</label>
            <input type="number" id="Annual_Premium" name="Annual_Premium" min="5000" max="100000" step="0.1" required>

            <label for="Vintage">Vintage (1-800):</label>
            <input type="number" id="Vintage" name="Vintage" min="1" max="800" required>

            <label for="Vehicle_Age">Vehicle Age:</label>
                <select id="Vehicle_Age" name="Vehicle_Age" required>
                <option value="">Select Vehicle Age</option>
                <option value="< 1 Year">&lt; 1 Year</option>
                <option value="1-2 Year">1-2 Years</option>
                <option value="> 2 Years">&gt; 2 Years</option>
                </select>

            <label for="Vehicle_Damage">Vehicle Damage:</label>
                <select id="Vehicle_Damage" name="Vehicle_Damage" required>
                  <option value="">Select Option</option>
                  <option value="Yes">Yes</option>
                  <option value="No">No</option>
                </select>

            <label for="Policy_Sales_Channel">Policy Sales Channel:</label>
                <select id="Policy_Sales_Channel" name="Policy_Sales_Channel" required>
                    <option value="">Select Channel, 0 if None of the options are applicable</option>
                    {% for key in options %}
                        <option value="{{ key }}">{{ key }}</option>
                    {% endfor %}
                </select>

            <button type="submit">Predict</button>
        </form>

        <form method="get" action="/train">
            <button type="submit" class="train-button">Train Model</button>
        </form>

        {% if context %}
            <div class="result">
                <h2>Result: {{ context }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
